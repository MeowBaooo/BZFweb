<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丈量預約 - 選材與資料填寫</title>
<style>
  :root{
    --bg-a:#f6f8ee; --bg-b:#eef3e0;
    --surface:#fdfdf7; --surface-light:#eaf1de;
    --ink:#333d29; --ink-soft:#75816a; --rule:#dbe4cc;
    --accent:#75975c; --accent-deep:#587843; --accent-glow: rgba(117,151,92,0.2);
    --accent2:#b9cf8f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:linear-gradient(160deg, var(--bg-a), var(--bg-b)) fixed;font-family:"Noto Sans TC",sans-serif;color:var(--ink);}
  .wrap{max-width:960px; margin:0 auto; padding:32px 20px 40px;}
  h1{font-size:23px; text-align:center; margin:0 0 8px; font-weight:800; letter-spacing:1px; color:#2e3624;}
  .subtitle{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:30px; line-height:1.8;}

  .step-indicator{display:flex; justify-content:center; gap:8px; margin-bottom:26px;}
  .step-dot{
    font-size:11.5px; padding:7px 18px; border-radius:20px; background:var(--surface-light);
    color:var(--ink-soft); border:1px solid var(--rule); letter-spacing:0.5px; font-weight:600;
  }
  .step-dot.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .view{display:none;}
  .view.active{display:block;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:18px; margin-bottom:24px;}
  .card{
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(135deg, var(--accent2), var(--rule) 60%, var(--accent2)) border-box;
    border:2px solid transparent; border-radius:18px;
    overflow:hidden; transition:box-shadow 0.2s, transform 0.2s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(180,130,70,0.18);}
  .card.selected{
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(135deg, var(--accent), var(--accent-deep)) border-box;
    box-shadow:0 8px 22px var(--accent-glow);
  }
  .card img{width:100%; height:170px; object-fit:contain; background:#fbfcf6; display:block; padding:10px;}
  .card .body{padding:14px 16px 16px;}
  .card .name{font-size:14px; font-weight:700; line-height:1.4; margin-bottom:5px;}
  .card .cost{font-size:14px; color:var(--accent-deep); font-weight:800; margin-bottom:9px;}
  .card .msg{font-size:11.5px; color:var(--ink-soft); line-height:1.7; white-space:pre-line; margin-bottom:12px; max-height:80px; overflow-y:auto;}
  .card .pick-btn{
    width:100%; padding:10px; font-size:13px; border:none; border-radius:24px;
    background:var(--surface-light); color:var(--accent-deep); cursor:pointer; font-weight:700; letter-spacing:0.5px;
    transition:background 0.2s, color 0.2s;
  }
  .card.selected .pick-btn{background:var(--accent); color:#fff;}

  .bottom-bar{
    position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--rule);
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px;
    box-shadow:0 -8px 20px rgba(180,130,70,0.1); border-radius:16px 16px 0 0;
  }
  .cart-status{font-size:13.5px; color:var(--ink-soft); font-weight:600;}
  .next-btn{
    padding:12px 30px; background:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff; border:none; border-radius:24px;
    font-size:14px; font-weight:700; cursor:pointer; letter-spacing:1px;
    transition:box-shadow 0.2s;
  }
  .next-btn:hover:not(:disabled){box-shadow:0 6px 16px var(--accent-glow);}
  .next-btn:disabled{opacity:0.35; cursor:default;}

  .form-panel{
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(135deg, var(--accent2), var(--rule) 50%, var(--accent2)) border-box;
    border:2px solid transparent; border-radius:22px; padding:32px;
  }
  .selected-summary{
    background:var(--surface-light); border-radius:12px; padding:16px 18px; margin-bottom:24px;
    font-size:13px; color:var(--ink-soft); line-height:1.9;
  }
  .form-row{margin-bottom:18px;}
  .form-row label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:7px; font-weight:600;}
  .form-row label .req{color:#c05a3f;}
  .form-row input, .form-row textarea{
    width:100%; padding:11px 14px; border:1px solid var(--rule); border-radius:10px;
    background:#fdfdf7; color:var(--ink); font-size:14px; font-family:inherit;
  }
  .form-row input:focus, .form-row textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
  .form-row textarea{resize:vertical; min-height:64px;}
  .form-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .back-btn{
    background:none; border:none; color:var(--accent-deep); font-size:13px; cursor:pointer;
    margin-bottom:20px; font-weight:600;
  }
  .submit-btn{
    width:100%; padding:14px; background:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff; border:none; border-radius:26px;
    font-size:16px; font-weight:800; cursor:pointer; letter-spacing:1.5px; margin-top:8px;
    transition:box-shadow 0.2s;
  }
  .submit-btn:hover:not(:disabled){box-shadow:0 8px 20px var(--accent-glow);}
  .submit-btn:disabled{opacity:0.5;}
  .submit-status{font-size:13.5px; text-align:center; margin-top:16px; min-height:18px; font-weight:600;}
  .submit-status.success{color:var(--accent-deep);}
  .submit-status.error{color:#c05a3f;}

  .done-panel{text-align:center; padding:70px 20px;}
  .done-panel .icon{
    font-size:40px; margin-bottom:18px; width:76px; height:76px; line-height:76px;
    background:linear-gradient(135deg, var(--accent2), var(--accent)); color:#fff; border-radius:50%; display:inline-block;
  }
  .done-panel h2{font-size:21px; font-weight:800; margin-bottom:10px; color:#2e3624;}
  .done-panel p{color:var(--ink-soft); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>丈量預約 · 選材服務</h1>
  <p class="subtitle">歡迎瀏覽衛浴商品，挑選您喜歡的款式，填寫聯絡資料即可完成丈量預約。</p>

  <div class="step-indicator">
    <div class="step-dot active" id="stepDot1">1. 選擇商品</div>
    <div class="step-dot" id="stepDot2">2. 填寫資料</div>
  </div>

  <!-- 步驟1：選材 -->
  <div class="view active" id="view-products">
    <div class="grid" id="productGrid"></div>
  </div>

  <!-- 步驟2：填表 -->
  <div class="view" id="view-form">
    <button class="back-btn" id="backBtn">← 返回重新選擇商品</button>
    <div class="form-panel">
      <div class="selected-summary" id="selectedSummary"></div>

      <div class="form-row">
        <label>客戶姓名 <span class="req">*</span></label>
        <input type="text" id="f_name" placeholder="請輸入姓名">
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>聯絡電話 <span class="req">*</span></label>
          <input type="tel" id="f_phone" placeholder="0900123456">
        </div>
        <div class="form-row">
          <label>電子郵件 <span class="req">*</span></label>
          <input type="email" id="f_email" placeholder="example@mail.com">
        </div>
      </div>
      <div class="form-row">
        <label>丈量地址 <span class="req">*</span></label>
        <input type="text" id="f_address" placeholder="請輸入完整地址">
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>希望丈量日期</label>
          <input type="text" id="f_date" placeholder="yyyy/mm/dd">
        </div>
        <div class="form-row">
          <label>希望丈量時段</label>
          <input type="text" id="f_timeslot" placeholder="早上或下午">
        </div>
      </div>
      <div class="form-row">
        <label>裝修空間</label>
        <input type="text" id="f_space" placeholder="例如：主衛浴、客用衛浴">
      </div>
      <div class="form-row">
        <label>裝修需求</label>
        <textarea id="f_need" placeholder="請簡述您的裝修需求"></textarea>
      </div>
      <div class="form-row">
        <label>備註</label>
        <textarea id="f_note" placeholder="其他想補充的資訊"></textarea>
      </div>

      <button class="submit-btn" id="submitBtn">確認送出丈量預約</button>
      <div class="submit-status" id="submitStatus"></div>
    </div>
  </div>

  <!-- 完成畫面 -->
  <div class="view" id="view-done">
    <div class="done-panel">
      <div class="icon">✓</div>
      <h2>預約已送出</h2>
      <p>感謝您的填寫，我們將盡快與您聯繫確認丈量時間。</p>
    </div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="cart-status" id="cartStatus">已選擇 0 項商品</div>
  <button class="next-btn" id="nextBtn" disabled>下一步：填寫資料</button>
</div>

  let selected = [];

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    products.forEach(p => {
      const isSel = selected.some(s => s.id === p.id);
      const card = document.createElement('div');
      card.className = 'card' + (isSel ? ' selected' : '');
      card.innerHTML = `
        <img src="${p.data}" alt="${p.name}">
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="cost">NT$ ${Number(p.cost).toLocaleString()}</div>
          <div class="msg">${p.msg}</div>
          <button class="pick-btn">${isSel ? '取消選擇' : '加入選材清單'}</button>
        </div>
      `;
      card.querySelector('.pick-btn').addEventListener('click', () => togglePick(p));
      grid.appendChild(card);
    });
  }

  function togglePick(p) {
    const idx = selected.findIndex(s => s.id === p.id);
    if (idx >= 0) selected.splice(idx, 1);
    else selected.push(p);
    renderProducts();
    updateBottomBar();
  }

  function updateBottomBar() {
    document.getElementById('cartStatus').textContent = `已選擇 ${selected.length} 項商品`;
    document.getElementById('nextBtn').disabled = selected.length === 0;
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    document.getElementById('view-products').classList.remove('active');
    document.getElementById('view-form').classList.add('active');
    document.getElementById('bottomBar').style.display = 'none';
    document.getElementById('stepDot1').classList.remove('active');
    document.getElementById('stepDot2').classList.add('active');
    document.getElementById('selectedSummary').innerHTML =
      '<strong>已選擇的商品：</strong><br>' + selected.map(p => `・${p.name}（${p.id}）`).join('<br>');
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('view-form').classList.remove('active');
    document.getElementById('view-products').classList.add('active');
    document.getElementById('bottomBar').style.display = 'flex';
    document.getElementById('stepDot2').classList.remove('active');
    document.getElementById('stepDot1').classList.add('active');
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    const email = document.getElementById('f_email').value.trim();
    const address = document.getElementById('f_address').value.trim();
    const date = document.getElementById('f_date').value.trim();
    const timeslot = document.getElementById('f_timeslot').value.trim();
    const space = document.getElementById('f_space').value.trim();
    const need = document.getElementById('f_need').value.trim();
    const note = document.getElementById('f_note').value.trim();
    const statusEl = document.getElementById('submitStatus');
    const btn = document.getElementById('submitBtn');

    if (!name || !phone || !email || !address) {
      statusEl.textContent = '請填寫所有必填欄位（姓名、電話、電子郵件、地址）';
      statusEl.className = 'submit-status error';
      return;
    }
    if (!/^09\d{2}(\d{6}|-\d{3}-\d{3})$/.test(phone)) {
      statusEl.textContent = '電話格式需為 09XXXXXXXX 或 09XX-XXX-XXX';
      statusEl.className = 'submit-status error';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = '送出中...';
    statusEl.className = 'submit-status';

    const materialCodes = selected.map(p => p.id).join(';');

    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, address, date, timeslot, space, need, note, materialCodes }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('view-form').classList.remove('active');
        document.getElementById('view-done').classList.add('active');
      } else {
        statusEl.textContent = data.error || '送出失敗，請稍後再試';
        statusEl.className = 'submit-status error';
        btn.disabled = false;
      }
    } catch (err) {
      statusEl.textContent = '連線發生問題，請稍後再試';
      statusEl.className = 'submit-status error';
      btn.disabled = false;
    }
  });

  renderProducts();
</script>
</body>
</html>
